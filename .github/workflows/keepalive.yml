# BROUILLON : à tester avant de s'y fier (voir docs/03-guide-demarrage.md, étape 7).
#
# But : envoyer régulièrement une vraie requête de lecture à la base Supabase
# pour éviter la mise en pause d'un projet gratuit (7 jours d'activité faible,
# d'après la documentation Supabase consultée le 15 octobre 2026).
#
# Prérequis :
#  - la table public.keepalive existe (supabase/migrations/0001_keepalive.sql)
#  - deux secrets GitHub : SUPABASE_URL et SUPABASE_ANON_KEY
#
# Limite connue : dans un dépôt PUBLIC, GitHub désactive les workflows planifiés
# après 60 jours sans activité sur le dépôt. Un dépôt privé n'est pas cité par
# la documentation pour cette règle. Le second mécanisme est la route
# app/api/keepalive appelée chaque jour par Vercel Cron (vercel.json).

name: keepalive-supabase

on:
  schedule:
    # Jours 1, 4, 7, ... du mois à 06:17 UTC : au plus 3 jours entre deux pings.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Requête de lecture sur la base Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Secrets SUPABASE_URL ou SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1")
          echo "Réponse HTTP : ${status}"
          if [ "${status}" != "200" ]; then
            echo "Échec du ping. Corps de la réponse :"
            cat response.json
            exit 1
          fi
